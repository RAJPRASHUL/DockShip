limit_req_zone $binary_remote_addr zone=github:10m rate=10r/s;

server {
    listen 80;
    server_name ~^platform\..+\.nip\.io$;

    location = /webhook/github {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        client_max_body_size 5m;
        limit_req zone=github burst=10 nodelay;
        limit_except POST {
            deny all;
        }
    }

    location / {
        return 404;
    }
}
